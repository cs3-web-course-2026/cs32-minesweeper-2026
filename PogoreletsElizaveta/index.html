<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="game-container">
    <h1>MINESWEEPER</h1>

    <!-- Хедер гри -->
    <header class="game-header">
      <div class="stat-box">
        <span class="stat-label">🚩</span>
        <span id="flags-count">006</span>
      </div>

      <button type="button" id="start-btn" class="start-btn" title="Почати нову гру" aria-label="Restart game">🤓</button>

      <div class="stat-box">
        <span class="stat-label">⏱️</span>
        <span id="timer">000</span>
      </div>
    </header>

    <!-- Динамічне ігрове поле 6x6 -->
    <main class="game-board" id="game-board"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
