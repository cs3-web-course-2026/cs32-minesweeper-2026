<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="game-container">
    <h1>MINESWEEPER</h1>

    <!-- Хедер гри -->
    <header class="game-header">
      <div class="stat-box">
        <span class="stat-label">🚩</span>
        <span id="flags-count">03</span>
      </div>

      <button id="start-btn" class="start-btn" title="Почати нову гру">🤓</button>

      <div class="stat-box">
        <span class="stat-label">⏱️</span>
        <span id="timer">013</span>
      </div>
    </header>

    <!-- Ігрове поле 6x6 -->
    <main class="game-board">
      <!-- Рядок 1 -->
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-1">1</button>
      <button class="cell"></button> <!-- Відкрита порожня клітинка -->
      <button class="cell"></button> <!-- Відкрита порожня клітинка -->
      <button class="cell"></button> <!-- Закрита клітинка -->

      <!-- Рядок 2 -->
      <button class="cell reveal num-1">1</button>
      <button class="cell mine exploded">💣</button>
      <button class="cell reveal num-2">2</button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-1">1</button>
      <button class="cell"></button>

      <!-- Рядок 3 -->
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-2">2</button>
      <button class="cell mine">💣</button>
      <button class="cell reveal num-2">2</button>
      <button class="cell flag">🚩</button>
      <button class="cell reveal num-1">1</button>

      <!-- Рядок 4 -->
      <button class="cell"></button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-2">2</button>
      <button class="cell reveal"></button>
      <button class="cell reveal num-2">2</button>
      <button class="cell reveal num-1">1</button>

      <!-- Рядок 5 -->
      <button class="cell flag">🚩</button>
      <button class="cell"></button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-2">2</button>
      <button class="cell mine">💣</button>

      <!-- Рядок 6 -->
      <button class="cell flag">🚩</button>
      <button class="cell"></button> <!-- Відкрита порожня клітинка -->
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell reveal num-1">1</button>
      <button class="cell reveal num-1">1</button>
    </main>
  </div>

</body>
</html>
