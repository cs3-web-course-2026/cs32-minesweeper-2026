<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title lang="en">Minesweeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="game">
      <header class="game-header">
        <div class="game-stat">
          <span class="game-stat-label" lang="en">Mines</span>
          <span class="game-stat-value" id="mine-counter">10</span>
        </div>

        <button id="restart-button" class="restart-button" type="button" aria-label="Restart game" lang="en">
          🔁
        </button>

        <div class="game-stat">
          <span class="game-stat-label" lang="en">Time</span>
          <span class="game-stat-value" id="timer">000</span>
        </div>
      </header>

      <section class="game-board" id="board" aria-label="Ігрове поле сапера"></section>

      <p class="game-message" role="status" aria-live="polite">
        Знайди всі міни!
      </p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
