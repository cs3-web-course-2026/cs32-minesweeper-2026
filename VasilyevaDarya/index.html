<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер - Лабораторна робота 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="minesweeper-game">
    <header class="game-header">
        <div class="counter" id="flag-count">010</div>
        <button type="button" class="start-btn" id="start-btn" aria-label="Почати гру заново">😊</button>
        <div class="counter" id="timer">000</div>
    </header>

    <main class="game-board">
        <div class="cell closed"></div>
        <div class="cell open">1</div>
        <div class="cell flag">🚩</div>
        <div class="cell flag mine-flag">🚩</div>
        <div class="cell mine">💣</div>
        <div class="cell mine clicked">💥</div>
    </main>
</div>

</body>
</html>
