<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="display timer" id="timer" role="timer" aria-label="Таймер гри">000</div>
            <button type="button" class="start-btn" id="restart-btn" aria-label="Почати нову гру">Restart</button>
            <div class="display flag-count" id="flag-count" role="status" aria-live="polite" aria-label="Залишок прапорців">015</div>
        </header>

        <div class="game-status" id="game-status" role="status" aria-live="polite">Гра триває</div>

        <main class="game-board" id="game-board" aria-label="Ігрове поле"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
