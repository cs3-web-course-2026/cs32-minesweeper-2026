<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="minesweeper-app">
        <header class="game-header">
            <div class="counter mines-counter" role="status" aria-live="polite" aria-label="Кількість мін">
                010
            </div>
            <button class="reset-btn" type="button" aria-label="Почати нову гру">
                🙂
            </button>
            <div class="counter timer" aria-label="Час гри">
                000
            </div>
        </header>

        <div class="game-status-message" aria-live="polite" style="text-align: center; font-weight: bold; margin-bottom: 10px; color: #22303c; min-height: 20px;"></div>

        <main class="game-board" aria-label="Ігрове поле Minesweeper"></main>
    </div>
    <script src="script.js"></script>
</body>
</html>
