<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапер — Прохоренко Микита</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="game-header">
      <p class="game-counter">
        <span class="visually-hidden">Залишилось прапорців:</span>
        <span class="game-counter-icon" aria-hidden="true">🚩</span>
        <span id="flags-counter" class="game-counter-value">000</span>
      </p>
      <button id="new-game-button" type="button" class="new-game-button">
        Нова гра
      </button>
      <p class="game-timer">
        <span class="visually-hidden">Час гри, секунд:</span>
        <span class="game-timer-icon" aria-hidden="true">⏱️</span>
        <span id="timer" class="game-timer-value">000</span>
      </p>
    </header>
    <main class="game">
      <div id="board" class="board" role="group" aria-label="Ігрове поле"></div>
      <p
        id="game-message"
        class="game-message"
        role="status"
        aria-live="polite"
      ></p>
    </main>
  </body>
</html>
