<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        .white-box {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 300px;
        }
        .info-line {
            margin: 10px 0;
            font-size: 1.2rem;
            color: #333;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="white-box">
        <div class="info-line"><span class="label">Name:</span> John</div>
        <div class="info-line"><span class="label">Surname:</span> Doe</div>
        <div class="info-line"><span class="label">Group:</span> CS101</div>
    </div>
</body>
</html>
