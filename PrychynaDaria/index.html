<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper — Практична робота №2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="game-wrapper">
    <div class="minesweeper bevel-outer" role="region" aria-label="Гра Сапер">
      
      <!-- Хедер: лічильник прапорців, кнопка рестарту, таймер -->
      <header class="game-header bevel-inset">
        <div class="lcd-counter" role="status" aria-live="polite" aria-label="Залишилось прапорців">
          <span id="flags-counter" class="lcd-digit">015</span>
        </div>

        <button type="button" id="reset-btn" class="btn-face bevel-btn" aria-label="Почати нову гру">
          <span id="face-icon" class="face-icon" aria-hidden="true">🙂</span>
        </button>

        <div class="lcd-counter" role="status" aria-live="polite" aria-label="Таймер">
          <span id="timer-display" class="lcd-digit">000</span>
        </div>
      </header>

      <!-- Контейнер сітки, що наповнюється через JavaScript -->
      <section id="minefield" class="grid bevel-inset" aria-label="Ігрове поле"></section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
