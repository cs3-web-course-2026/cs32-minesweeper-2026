<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">
        <header class="game-header">
            <div class="display" role="status" aria-live="polite" aria-label="Кількість прапорців" title="Прапорці">
                <span class="icon-flag">🏴‍☠️</span> <span id="flags-count">010</span>
            </div>

            <button type="button" class="start-btn" id="start-btn" aria-label="Почати нову гру">
                🧭
            </button>

            <div class="display" aria-label="Час гри" title="Час">
                ⏳ <span id="timer">000</span>
            </div>
        </header>

        <section class="game-board" aria-label="Ігрове поле">
        </section>

        <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"
            aria-describedby="modal-text">
            <div class="modal-content">
                <div id="modal-announce" role="status" aria-live="polite" class="sr-only"></div>
                <h2 id="modal-title"></h2>
                <p id="modal-text"></p>
                <button type="button" id="modal-btn" class="start-btn modal-btn">
                    Зрозуміло
                </button>
            </div>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>

</html>
