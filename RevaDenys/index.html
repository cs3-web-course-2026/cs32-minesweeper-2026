<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viking Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viking-frame">
      <span class="rune-corner top-left" aria-hidden="true">ᚠ</span>
      <span class="rune-corner top-right" aria-hidden="true">ᚦ</span>
      <span class="rune-corner bottom-left" aria-hidden="true">ᛟ</span>
      <span class="rune-corner bottom-right" aria-hidden="true">ᛏ</span>

      <h1 class="game-title">MineSweeper</h1>

      <header class="viking-header">
        <div
          class="stone-tracker"
          title="Залишилося ворожих пасток"
          role="status"
          aria-live="polite"
        >
          <span class="tracker-icon" aria-hidden="true">🚩</span>
          <span
            class="tracker-value"
            id="flag-count"
            aria-label="Залишилось пасток: 10"
            >010</span
          >
        </div>

        <button
          type="button"
          class="valhalla-btn"
          aria-label="Розпочати нову битву"
          id="btn-restart"
        >
          <span class="viking-avatar" aria-hidden="true">🛡️</span>
        </button>

        <div class="stone-tracker" title="Час випробування">
          <span class="tracker-icon" aria-hidden="true">⏳</span>
          <time
            class="tracker-value"
            id="timer"
            role="timer"
            aria-live="off"
            aria-label="Минуло секунд: 0"
            >000</time
          >
        </div>
      </header>

      <section
        class="viking-grid"
        id="grid"
        role="grid"
        aria-label="Ігрове поле Сапер, сітка 8 на 8"
        aria-rowcount="8"
        aria-colcount="8"
      ></section>

      <p
        id="game-message"
        class="game-message"
        role="status"
        aria-live="polite"
      ></p>

      <footer class="viking-footer">
        <span>Гарної гри</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
