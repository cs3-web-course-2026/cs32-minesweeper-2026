<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper — Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Start Menu -->
<div id="menu-card" class="card menu-card">
    <div class="card-header">
        <h2>Minesweeper Settings</h2>
    </div>

    <div class="card-body">
        <div class="size-selector">
            <div class="input-group">
                <label for="rows">Rows:</label>
                <input type="number" id="rows" value="8" min="5" max="15">
            </div>
            <span class="multiply">×</span>
            <div class="input-group">
                <label for="columns">Columns:</label>
                <input type="number" id="columns" value="8" min="5" max="15">
            </div>
        </div>

        <p id="menu-error" class="error-text"></p>
        <button type="button" id="start-btn" class="btn-start">Start Game</button>
    </div>
</div>

<!-- Game Container -->
<div class="game-container hidden" id="game-container">
    <header class="game-header">
        <div class="info-box">
            <span class="info-label">💣 Mines:</span>
            <span id="mines-count">5</span>
        </div>
        <div class="info-box">
            <span class="info-label">⏱️ Time:</span>
            <span id="timer">00:00</span>
        </div>
        <div class="info-box">
            <span class="info-label">Cells left:</span>
            <span id="closed-count">18</span>
        </div>
        <button type="button" class="btn-restart" id="restart-btn">Restart</button>
        <div id="game-status" role="status" aria-live="polite" class="sr-only">Game in progress</div>
    </header>

    <main class="board-wrapper">
        <div class="board" id="board-element"></div>
    </main>
</div>

<!-- Game Over / Victory Modal Popup -->
<div class="modal-overlay hidden" id="game-modal" role="presentation">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Game Over</h2>
        <p id="modal-message">You lost the game!</p>
        <button type="button" class="btn-start" id="modal-restart-btn">Play Again</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
