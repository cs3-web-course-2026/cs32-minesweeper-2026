<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="game">
        <h1>Minesweeper</h1>

        <header class="game-header">
            <div class="game-info">
                <span class="label">Час</span>
                <span class="value" id="timer">00</span>
            </div>

            <button class="restart-button" type="button" aria-label="Почати нову гру">
                🙂
            </button>

            <div class="game-info">
                <span class="label">Прапорці</span>
                <span class="value" id="flag-count">0 / 10</span>
            </div>
        </header>

        <!-- Ігрове поле створюється динамічно через JavaScript -->
        <section class="board" aria-label="Ігрове поле Minesweeper">

        </section>

        <!-- Повідомлення про поточний стан гри -->
        <p id="game-status" role="status" aria-live="polite">
            Гра триває
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
