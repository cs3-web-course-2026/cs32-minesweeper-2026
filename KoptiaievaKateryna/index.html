<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <h1 class="game-title">Minesweeper</h1>

      <header class="game-header">
        <p class="counter counter-flags">
          <span class="counter-label">Flags</span>
          <span class="counter-value" id="flag-counter">15</span>
        </p>
        <button
          type="button"
          class="start-button"
          id="start-button"
          aria-label="Start new game"
          title="Start new game"
        >
          😈
        </button>
        <p class="counter counter-timer">
          <span class="counter-label">Time</span>
          <time class="counter-value" id="timer" datetime="PT0S">0:00</time>
        </p>
      </header>

      <section class="board" id="board" aria-label="Minefield"></section>

      <p class="game-message" id="game-message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
